<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Vídeos</title>
</head>
<body>
    <h1>trabalho com imagens</h1>
    <h2>imagens responsiva básica</h2>
    <figure class="resp-bas">
        <img src="https://cptstatic.s3.amazonaws.com/imagens/enviadas/materias/materia10341/racas-de-cachorro-pit-bull-terrier-ou-american-pit-bull-terrier-cpt11.jpg" alt="Imagem 1">
    </figure>

    <h2>Imagem com recorte</h2>
    <figure class="img-rec">
        <img src="https://labovet.com.br/wp-content/uploads/2024/11/GATOS-EXOTICOS-E-DIFERENCIADOS-DO-PLANETA.jpg" alt="Imagem 2">
    </figure>

    <h2>Imagem em formato de cards</h2>
    <figure class="img-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAlMWYDDbqc3D-i24tS1jKiJ6aKw7TH__v9moNj-W23_dj90QwcXzwPKdL&s=10" alt="Imagem 3">
    </figure>

    <h2>Personalização</h2>
    <figure class="pers-img">
        <img src="https://i.redd.it/sgb5fhyyvfae1.png" alt="Imagem 4">
    </figure>

    <h2>Imagens em grid</h2>
    <article class="img-grid">
        <img src="https://thumbs.dreamstime.com/z/macaco-2377413.jpg" alt="imagens 5">
    </article>

    <article class="img-grid">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3F9-103l6mZiKNHwsHQ2IQN_ekvAk90ZKeyXDaMF0_nNQt_limyT_mV9f&s=10" alt="imagens 6">
    </article>

    <article class="img-grid">
        <img src="https://www.jabutigre.com.br/_next/image?url=%2Fuploads%2Fcoruja-suindara-na-fazenda-1787752975045-f0e6d934db5f.jpg&w=3840&q=75" alt="imagens 7">
    </article>
    <section class="video">
        <h2>musica</h2>
        <iframe class="video-bd" width="560" height="315" src="https://www.youtube.com/embed/pZ-oEuWMszs?si=V415nPYUbwEQM4De" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        
    </section>
    
</body>
</html>
